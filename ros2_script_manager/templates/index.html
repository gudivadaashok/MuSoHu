<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS2 Script Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://cs.gmu.edu/~xiao/xuesu_website_files/RobotiXX_gmu.gif" alt="RobotiXX Logo" class="logo">
        </div>
        <div class="title-section">
            <h1>MuSoHu</h1>
            <p class="subtitle">Multi-Modal Social Human Navigation Dataset</p>
            <p class="server-status">Server Time: <span id="server-time">Connecting...</span></p>
        </div>
        
        <!-- Toast Container -->
        <div id="toast-container"></div>
        
        <div id="scripts-container"></div>

        <!-- Sync Time -->
        <div class="sync-time">
            <form action="/sync_time" method="post" id="syncTimeForm">
                <input type="hidden" name="client_time" id="client_time">
                <input type="hidden" name="client_timezone" id="client_timezone">
                <button type="submit" class="btn-sync">Sync Time from Client to Jetson</button>
            </form>
        </div>
        
        <footer class="footer">
            <p>Contact us at <a href="https://robotixx.cs.gmu.edu/index.html" target="_blank" rel="noopener noreferrer">RobotiXX Lab</a></p>
        </footer>
    </div>

    <script>
        // Confirm connection
        var socket = io();
        socket.on('connect', function() {
            console.log('Websocket connected!');
        });
        
        // Listen for server time updates
        socket.on('server_time', function(msg) {
            document.getElementById('server-time').textContent = msg.time;
        });

        // Toast Notification System
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const icons = {
                success: '✓',
                error: '✗',
                info: 'ℹ'
            };
            
            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.info}</div>
                <div class="toast-message">${message}</div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
            
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Auto-remove after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Add client time to sync form before submit
        document.getElementById('syncTimeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const now = new Date();
            const utcString = now.toISOString();
            document.getElementById('client_time').value = utcString;
            
            // Get client timezone
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            document.getElementById('client_timezone').value = timezone;

            const formData = new FormData(this);
            // Conlog logging
            console.log(`Sync Time Requested: ${utcString}, Timezone: ${timezone}`);
            try {
                const response = await fetch('/sync_time', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    showToast(result.message, 'success');
                } else {
                    showToast(result.message, 'error');
                }
            } catch (err) {
                showToast('Failed to sync time: ' + err, 'error');
            }
        });

        async function loadScripts() {
            const response = await fetch('/api/scripts');
            const data = await response.json();
            
            const scripts = data.scripts;
            const serverTime = data.server_time;

            document.getElementById('server-time').textContent = serverTime;
            
            const container = document.getElementById('scripts-container');
            container.innerHTML = '';
            
            for (const [id, script] of Object.entries(scripts)) {
                const card = createScriptCard(id, script);
                container.appendChild(card);
            }
        }

        function createScriptCard(id, script) {
            const card = document.createElement('div');
            card.className = 'script-card';
            
            const isRunning = script.status === 'running';
            const statusText = isRunning 
                ? `🟢 Running${script.pid ? ` (PID: ${script.pid})` : ''}`
                : '🔴 Stopped';
            
            card.innerHTML = `
                <h3>${script.description}</h3>
                <p><code>${script.command}<br>&nbsp;</code></p>
                <div style="margin-top: auto;">
                    <div class="status ${isRunning ? 'running' : 'stopped'}">
                        ${statusText}
                    </div>
                    <button onclick="toggleScript('${id}', ${isRunning})" 
                            class="${isRunning ? 'btn-stop' : 'btn-start'}">
                        ${isRunning ? 'Stop' : 'Start'}
                    </button>
                </div>
            `;
            
            return card;
        }

        async function toggleScript(id, isRunning) {
            const action = isRunning ? 'stop' : 'start';
            
            try {
                const response = await fetch(`/api/scripts/${id}/${action}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showToast(result.message, 'success');
                    loadScripts();
                } else {
                    showToast('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        // Load scripts on page load
        loadScripts();
        
        // Refresh every 5 seconds
        setInterval(loadScripts, 5000);
    </script>
</body>
</html>
